<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listening test</title>
<style>
  :root { --bg:#f7f8f5; --fg:#1d221f; --muted:#68706b; --accent:#1f7a4d; --line:#dfe3dd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141714; --fg:#e8ece7; --muted:#9aa39c; --accent:#5cc28d; --line:#2b302c; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  button { font:inherit; padding:10px 18px; border-radius:999px; border:1px solid var(--line); background:var(--accent); color:#fff; cursor:pointer; }
  button.stop { background:transparent; color:var(--fg); }
  #state { margin-left:12px; color:var(--muted); }
  #state.speaking { color:var(--accent); font-weight:600; }
  ol { padding-left:20px; }
  li { padding:8px 0; border-bottom:1px solid var(--line); }
  li .t { font-size:18px; }
  li small { color:var(--muted); display:block; }
</style>
</head>
<body>
<main>
  <h1>Hands-free listening test</h1>
  <p>Press start and just talk, no button while speaking. Each pause ends a question.</p>
  <button id="toggle">Start listening</button><span id="state">Off</span>
  <ol id="log"></ol>
</main>
<script type="module">
import { MicStream } from '/call/mic.js';
const $ = s => document.querySelector(s);
const VOICE_WS = 'ws://127.0.0.1:8765/ws/listen';
let mic = null, ws = null, stoppedAt = 0;

function state(text, speaking = false) { $('#state').textContent = text; $('#state').className = speaking ? 'speaking' : ''; }

async function start() {
  ws = new WebSocket(VOICE_WS);
  ws.binaryType = 'arraybuffer';
  await new Promise((ok, bad) => { ws.onopen = ok; ws.onerror = () => bad(new Error('Voice service not running on :8765')); });
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'vad' && m.speaking) state('Listening to you…', true);
    if (m.type === 'vad' && !m.speaking) { stoppedAt = performance.now(); state('Transcribing…'); }
    if (m.type === 'transcript') {
      const li = document.createElement('li');
      const t = document.createElement('div'); t.className = 't'; t.dir = 'auto'; t.textContent = m.text;
      const s = document.createElement('small');
      s.textContent = `${m.engine} · ${m.duration_s}s speech · stt ${m.stt_ms} ms · ready ${Math.round(performance.now() - stoppedAt)} ms after you stopped`
        + (m.fallback_reason ? ` · fell back: ${m.fallback_reason}` : '');
      li.append(t, s); $('#log').prepend(li);
      state('Waiting for you to speak');
    }
  };
  mic = new MicStream();
  await mic.start(frame => ws.readyState === 1 && ws.send(frame));
  state('Waiting for you to speak');
  $('#toggle').textContent = 'Stop'; $('#toggle').className = 'stop';
}

async function stop() {
  await mic?.stop(); ws?.close(); mic = ws = null;
  state('Off'); $('#toggle').textContent = 'Start listening'; $('#toggle').className = '';
}

$('#toggle').onclick = () => (mic ? stop() : start().catch(e => { state(e.message); stop(); }));
</script>
</body>
</html>
